<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sreshta Fresh</title>
  <meta name="description" content="Fresh veggies, flowers, country eggs and country chicken from Sreshta Farms. Order online, pay when you receive it.">
  <meta name="theme-color" content="#015c30">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a href="#" class="brand" aria-label="Sreshta Fresh home"><img src="logo.png" alt="Sreshta Fresh by Sreshta Farms"></a>
    <a href="#orders" class="pill-btn" id="myOrdersBtn">🧾 My orders</a>
  </header>

  <main>
    <!-- SHOP -->
    <section id="view-shop" class="view on">
      <div class="hero">
        <div>
          <h1>Fresh from our farm, today</h1>
          <p>Order now, pay by Cash or PhonePe when you receive it.</p>
        </div>
        <div class="live" id="live"><span class="dot"></span><span id="liveTxt">Connecting…</span></div>
      </div>
      <div id="notice"></div>
      <div id="chickenCard"></div>
      <nav class="cats" id="cats"></nav>
      <div class="grid" id="grid"><div class="loading">Loading today's produce…</div></div>
    </section>

    <!-- MY ORDERS -->
    <section id="view-orders" class="view">
      <a href="#" class="back">← Back to shop</a>
      <h2>My orders</h2>
      <div class="card">
        <label for="mo-phone">Your phone number</label>
        <div class="inline">
          <input id="mo-phone" type="tel" inputmode="numeric" maxlength="14" placeholder="10-digit mobile">
          <button class="btn green" id="mo-go">Show</button>
        </div>
      </div>
      <div id="mo-list"></div>
    </section>

    <!-- ORDER PLACED -->
    <section id="view-done" class="view"></section>
  </main>

  <div class="basket-bar" id="basketBar" hidden>
    <button id="openBasket"><span id="bbCount"></span><span class="bb-go">View basket →</span></button>
  </div>

  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
