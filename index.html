<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sreshta Fresh</title>
  <meta name="description" content="Fresh veggies, flowers, country eggs and country chicken from Sreshta Farms. Order online, pay when you receive it.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- ?v= is bumped on every update so browsers fetch the new file instead of an old saved copy -->
  <link rel="stylesheet" href="style.css?v=20261028a">
</head>
<body>
  <header class="top">
    <a href="#" class="brand" aria-label="Sreshta Fresh home"><img src="logo.png" alt="Sreshta Fresh by Sreshta Farms"></a>
    <nav class="nav" id="nav"></nav>
    <a href="#orders" class="pill-btn" id="myOrdersBtn">My orders</a>
  </header>

  <main>
    <!-- SHOP -->
    <section id="view-shop" class="view on">
      <section class="promo" id="promo" aria-label="Offers and highlights"></section>
      <div class="infobar">
        <span class="live" id="live"><span class="dot"></span><span id="liveTxt">Connecting…</span></span>
        <span class="sep">·</span>
        <span>Order now, pay by Cash or PhonePe when you receive it</span>
      </div>
      <div id="notice"></div>
      <div id="chickenCard"></div>
      <div class="grid" id="grid"><div class="loading">Loading today's produce…</div></div>
    </section>

    <!-- MY ORDERS -->
    <section id="view-orders" class="view">
      <a href="#" class="back">← Back to shop</a>
      <h2>My orders</h2>
      <div class="card">
        <label for="mo-phone">Your phone number</label>
        <div class="inline">
          <input id="mo-phone" type="tel" inputmode="numeric" maxlength="14" placeholder="10-digit mobile">
          <button class="btn dark" id="mo-go">Show</button>
        </div>
      </div>
      <div id="mo-list"></div>
    </section>

    <!-- ORDER PLACED -->
    <section id="view-done" class="view"></section>
  </main>

  <footer class="site-foot">
    <nav><a href="contact.html">Contact us</a><a href="terms.html">Terms &amp; Conditions</a><a href="privacy.html">Privacy Policy</a><a href="refund.html">Refund &amp; Cancellation</a><a href="shipping.html">Delivery Policy</a></nav>
    <p>© Sreshta Fresh · MK Gold Coast, Yendada, Visakhapatnam</p>
  </footer>

  <div class="basket-bar" id="basketBar" hidden>
    <button id="openBasket"><span id="bbCount"></span><span class="bb-go">View basket →</span></button>
  </div>

  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="config.js?v=20261028a"></script>
  <script src="app.js?v=20261028a"></script>
</body>
</html>
